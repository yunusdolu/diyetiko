# Supabase CLI config for local development (`supabase start`, `supabase db reset`,
# `supabase test db`). Only the settings this project depends on are listed; everything else
# uses the CLI defaults. Production settings live in the Supabase dashboard (see README).
project_id = "diyetiko"

[db]
major_version = 17

[db.seed]
# Off on purpose: seed.sql assigns content to the dietitian's auth user, which must exist first.
# Run it manually after creating the account (README → "Create the admin user", "Seed").
enabled = false

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/admin"]
# Single-owner app: the dietitian's account is created by hand; nobody can sign up.
enable_signup = false

[auth.email]
enable_signup = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
file_size_limit = "10MiB"
