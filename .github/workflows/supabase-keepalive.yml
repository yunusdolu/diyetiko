# Supabase pauses a free project after 7 days without activity; while paused, every login and
# every button on the site waits without an answer. Once a day this opens a share link that does
# not exist on each site: the page asks the database, which keeps the project awake. The answer
# must be 404 ("no such link"); anything else (500, timeout) means the database is unreachable —
# the run fails and GitHub e-mails you: restore the project in the Supabase dashboard.
# No secrets needed.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 6 * * *' # every day 06:17 UTC (09:17 Türkiye)
  workflow_dispatch:

permissions: {}

env:
  # one site per Supabase project (space-separated)
  SITES: https://diyetiko.vercel.app https://diyetiko-demo.vercel.app
  TOKEN: keepalive-ping-0000000000000000000000000000000

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ask each site's database once
        run: |
          failed=0
          for site in $SITES; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 90 "$site/p/$TOKEN" || true)
            echo "$site → HTTP $code"
            if [ "$code" != "404" ]; then
              echo "::error::$site answered $code. Its Supabase project may be paused: restore it in the dashboard."
              failed=1
            fi
          done
          exit $failed
